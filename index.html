<style>

*{box-sizing:border-box}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}

input:focus,select:focus,textarea:focus{border-color:var(--ac)}

.hide{display:none}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hero>div{border-radius:16px;padding:16px 14px}

<body>
<h1><span class="ball"></span>Besaitung</h1>
<nav id="nav"></nav>
<div id="v"></div>
<script>
let SERVICE=10,LOW=2;
let D={strings:[],orders:[],purchases:[]},tab='dash',per='m',af='open',fo=false,eo=null,kc=null,cf=null,edS=null,fe=false,ebi=1,bx=null,bimp=false,pd=null;const done=o=>o.self?!!o.strung:(o.strung&&o.paid&&o.delivered);const extP=()=>D.settings.ext??MIN;const FIL={all:['Alle',()=>true],open:['Offen',o=>!done(o)],ns:['Nicht besaitet',o=>!o.strung],np:['Nicht bezahlt',o=>!o.self&&!o.paid],nd:['Nicht ausgeliefert',o=>!o.self&&!o.delivered],self:['Für mich',o=>!!o.self],done:['Erledigt',done]};let MIN=20;const ROLL=14;
try{const s=localStorage.getItem('besaitung');if(s)D=JSON.parse(s)}catch(e){}
norm();
const save=()=>{try{localStorage.setItem('besaitung',JSON.stringify(D))}catch(e){}};
const eur=n=>(Math.round(n*100)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const $=id=>document.getElementById(id);

const fs=n=>String(n).replace('.',',');
function norm(){D.purchases=D.purchases||[];D.tools=D.tools||[];D.machine=D.machine||{};D.settings=D.settings||{};const t=D.settings;document.documentElement.dataset.theme=t.theme&&t.theme!='auto'?t.theme:'';if(!t.theme||t.theme=='auto')document.documentElement.removeAttribute('data-theme');SERVICE=t.service??10;MIN=t.min??20;LOW=t.low??2}
const od=o=>o.ts?new Date(o.ts):(p=>new Date(p[2],p[1]-1,p[0]))(o.date.split('.'));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const IC={dash:'<rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/>',lager:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',ein:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',auf:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>',kund:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.5c2.5 0 4 1.6 4 4.5"/>',mehr:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
function nav(){$('nav').innerHTML=[['dash','Start'],['lager','Lager'],['ein','Eingang'],['auf','Aufträge'],['kund','Kunden'],['mehr','Mehr']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';cf=null;render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')}

function render(){nav();$('v').innerHTML=bk()+(tab=='dash'?dash():tab=='lager'?lager():tab=='ein'?ein():tab=='kund'?kund():tab=='mehr'?mehr():auf());if(tab=='ein')calcEin();if(tab=='auf')calcAuf(0)}

function lager(){
 const tot=D.strings.reduce((a,s)=>a+s.sets*s.price,0);
 let h=`<div class="card"><div class="row"><b>Lagerwert</b><b>${eur(tot)}</b></div></div>`;
 if(!D.strings.length)h+='<div class="card mu">Noch keine Saiten. Lege sie unter „Wareneingang“ an.</div>';
 D.strings.forEach(s=>{
 if(edS==s.id){h+=`<div class="card"><label>Name</label><input id="sn" value="${esc(s.name)}"><div class="two"><div><label>Bestand (Sets)</label><input id="sb" inputmode="decimal" value="${fn(s.sets)}"></div><div><label>Preis / Set (€)</label><input id="sp" inputmode="decimal" value="${fn(s.price)}"></div></div>
 <div style="text-align:right;margin-top:10px"><button class="sm" onclick="edS=null;render()">Abbrechen</button><button class="sm" onclick="saveS('${s.id}')">Speichern</button></div></div>`;return}
 h+=`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="${s.sets<LOW?'low':''}">${fs(s.sets)} Sets</span></div>
 <div class="row mu"><span>Einstand ${eur(s.price)} / Set (12 m)</span><span>Verkauf ${eur(s.price+SERVICE)}</span></div>
 <div style="margin-top:8px;text-align:right"><button class="sm" onclick="edS='${s.id}';render()">Bearbeiten</button><button class="sm ${cf=='s'+s.id?'low':''}" onclick="delS('${s.id}')">${cf=='s'+s.id?'Wirklich löschen?':'Löschen'}</button></div></div>`});

 return h}

function saveS(id){const s=D.strings.find(x=>x.id==id);s.name=$('sn').value.trim()||s.name;s.sets=Math.max(0,Math.round(num($('sb').value)*2)/2);s.price=num($('sp').value);edS=null;save();render()}
function delS(id){if(cf!='s'+id){cf='s'+id;render();return}cf=null;D.strings=D.strings.filter(x=>x.id!=id);save();render()}

function chart(){
 const now=new Date(),M=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const os=D.orders.filter(o=>{const x=od(o);return x.getMonth()==d.getMonth()&&x.getFullYear()==d.getFullYear()});
  M.push({l:d.toLocaleDateString('de-DE',{month:'short'}),u:os.filter(o=>!o.self).reduce((a,o)=>a+o.price,0),g:os.filter(o=>!o.self).reduce((a,o)=>a+o.price-o.cost,0),s:os.filter(o=>o.self).reduce((a,o)=>a+o.cost,0)})}
 const mx=Math.max(1,...M.map(m=>Math.max(m.u,m.s))),sl=340/6,bw=14,B=125,Hh=105;
 const bar=(x,v,col)=>{const h=Math.max(0,v/mx*Hh);return `<rect x="${x}" y="${B-h}" width="${bw}" height="${h}" rx="3" style="fill:${col}"/><text x="${x+bw/2}" y="${B-h-3}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${v>0?Math.round(v):''}</text>`};
 return `<div class="card"><div class="row"><b>Letzte 6 Monate</b><span class="mu"><span style="color:var(--ac)">■</span> Umsatz <span style="color:var(--c2)">■</span> Gewinn <span style="color:var(--c3)">■</span> Eigenes Material</span></div>
 <svg viewBox="0 0 340 150" width="100%" style="margin-top:6px">${M.map((m,i)=>{const x=i*sl+(sl-3*bw-6)/2;return bar(x,m.u,'var(--ac)')+bar(x+bw+3,m.g,'var(--c2)')+bar(x+2*(bw+3),m.s,'var(--c3)')+`<text x="${i*sl+sl/2}" y="142" text-anchor="middle" font-size="10" style="fill:var(--tx)">${m.l}</text>`}).join('')}<line x1="0" y1="${B}" x2="340" y2="${B}" style="stroke:var(--bd)"/></svg></div>`}
function dash(){
 const now=new Date();
 const os=D.orders.filter(o=>{if(per=='all')return true;const d=od(o);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()});
 const own=os.filter(o=>o.self),no=os.filter(o=>!o.self),sp=own.reduce((a,o)=>a+(o.ext||0)-o.cost,0),sn=own.length,sx=own.reduce((a,o)=>a+(o.ext||0),0),sm=own.reduce((a,o)=>a+o.cost,0);
 const u=no.reduce((a,o)=>a+o.price,0),k=no.reduce((a,o)=>a+o.cost,0),n=no.length;
 const cnt={};os.forEach(o=>cnt[o.stringName]=(cnt[o.stringName]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const lw=D.strings.reduce((a,x)=>a+x.sets*x.price,0),ls=D.strings.reduce((a,x)=>a+x.sets,0),low=D.strings.filter(x=>x.sets<LOW);
 const ex=D.tools.filter(t=>t.st=='bought'&&t.ts&&(per=='all'||(new Date(t.ts).getMonth()==now.getMonth()&&new Date(t.ts).getFullYear()==now.getFullYear()))).reduce((a,t)=>a+t.cost,0);
 const c=(l,v)=>`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div></div>`;
 return `<div class="seg"><button class="${per=='m'?'on':''}" onclick="per='m';render()">Dieser Monat</button><button class="${per=='all'?'on':''}" onclick="per='all';render()">Gesamt</button></div>
 <div class="hero"><div class="a"><span class="k">Umsatz</span><span class="v">${eur(u)}</span></div><div class="b"><span class="k">Gewinn</span><span class="v">${eur(u-k)}</span></div><div class="c"><span><span class="k">Tatsächlich übrig</span><span class="mu">Gewinn − eigenes Material</span></span><span class="v" style="${u-k-sm<0?'color:var(--wa)':''}">${eur(u-k-sm)}</span></div></div>
 <div class="card stats">${[['Aufträge',n],['Ø pro Auftrag',eur(n?u/n:0)],['Offene Aufträge',D.orders.filter(o=>!done(o)).length],['Noch nicht bezahlt',eur(D.orders.filter(o=>!o.self&&!o.paid).reduce((a,o)=>a+o.price,0))],['Lagerwert',eur(lw)],['Sets im Lager',fs(ls)],['Ausgaben Werkstatt',eur(ex)],['Gewinn nach Ausgaben',eur(u-k-ex)],['Gespart (selbst besaitet)',eur(sp)],['Eigene Schläger',sn],['Eigenes Material',eur(sm)]].map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}</div>${chart()}
 <div class="card"><b>Meistgenutzte Saiten</b>${top.length?top.map(t=>`<div class="row"><span>${esc(t[0])}</span><span class="mu">${t[1]}×</span></div>`).join(''):'<div class="mu">Keine Daten</div>'}</div>
 ${low.length?`<div class="card"><b class="low">Nachbestellen</b>${low.map(x=>`<div class="row"><span>${esc(x.name)}</span><span class="low">${fs(x.sets)} Sets</span></div>`).join('')}</div>`:''}`}

function eblk(i){
 return `<div class="eb" data-i="${i}" style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px"><div class="row"><b>Position ${i+1}</b>${i>0?`<button class="sm" onclick="this.closest('.eb').remove();calcEin()">Entfernen</button>`:''}</div>
 <label>Saite</label><select id="es${i}" onchange="$('nn${i}').classList.toggle('hide',this.value!='new');calcEin()">${D.strings.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}<option value="new">+ Neue Saite anlegen</option></select>
 <div id="nn${i}" class="${D.strings.length?'hide':''}"><label>Name / Marke</label><input id="en${i}" placeholder="z. B. Luxilon Alu Power 1,25" oninput="calcEin()"></div>
 <label>Einheit</label><select id="eu${i}" onchange="calcEin()"><option value="1">Set (12 m)</option><option value="${ROLL}">Rolle (200 m = ${ROLL} Sets)</option></select>
 <div class="two"><div><label>Anzahl</label><input id="ec${i}" type="number" inputmode="numeric" value="1" oninput="calcEin()"></div><div><label>Preis pro Einheit (€)</label><input id="ep${i}" inputmode="decimal" placeholder="0,00" oninput="calcEin()"></div></div></div>`}
function addE(){if(document.querySelectorAll('.eb').length>=10){toast('Maximal 10 Positionen');return}$('ebl').insertAdjacentHTML('beforeend',eblk(ebi++));calcEin()}
function ein(){ebi=1;
 const shops=[...new Set(D.purchases.map(x=>x.shop).filter(Boolean))];
 const form=`<div class="card"><b>Neue Bestellung</b>
 <label>Bestellt bei</label><input id="esh" list="shl" autocomplete="off" placeholder="z. B. Tennis-Point"><datalist id="shl">${shops.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <div id="ebl">${eblk(0)}</div><button class="sm" style="margin:10px 0 0" onclick="addE()">+ Weitere Saite</button>
 <label>Versandkosten gesamt (€)</label><input id="ev" inputmode="decimal" placeholder="0,00" oninput="calcEin()">
 <div class="two"><div><label>Rabattcode</label><input id="ecd" placeholder="optional"></div><div><label>Rabatt</label><div class="two"><input id="ed" inputmode="decimal" placeholder="0" oninput="calcEin()"><select id="dt" onchange="calcEin()"><option value="e">€</option><option value="p">%</option></select></div></div></div>
 <div class="sum" id="esum"></div><button class="btn" onclick="addEin()">Ins Lager buchen</button></div>`;
 let h=`<button class="btn" style="margin:0 0 10px" onclick="fe=!fe;render()">${fe?'– Schließen':'+ Neue Bestellung'}</button>`+(fe?form:'');
 const P=[...D.purchases].reverse();
 h+=`<div class="mu" style="margin:0 2px 8px">Bisherige Bestellungen (${P.length})</div>`;
 if(!P.length)h+='<div class="card mu">Noch keine Bestellungen erfasst.</div>';
P.forEach(x=>{const o=pd==x.id,tot=x.lines.reduce((a,l)=>a+l.sets,0);
  h+=`<div class="card"><div class="row" style="cursor:pointer" onclick="pd=${o?'null':`'${x.id}'`};render()"><b>${o?'▾':'▸'} ${esc(x.shop||'Bestellung')}</b><b>${eur(x.total)}</b></div>
  <div class="mu">${x.date}${o?'':`<br>${x.lines.map(l=>`${l.count}× ${esc(l.name)}${l.unit>1?' (Rolle)':''}`).join(', ')}`}</div>
  ${o?`<div style="overflow-x:auto;margin-top:6px"><table><tr><th>Saite</th><th class="r">Menge</th><th class="r">Preis</th><th class="r">Sets</th><th class="r">Pro Set</th></tr>${x.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.count}${l.unit>1?' Rolle'+(l.count>1?'n':''):'×'}</td><td class="r">${eur(l.price)}</td><td class="r">${l.sets}</td><td class="r"><b>${eur(l.unitCost)}</b></td></tr>`).join('')}</table></div>
  <div class="sum">Waren ${eur(x.goods)}${x.disc>0?`<br>Rabatt −${eur(x.disc)}${x.code?` (Code ${esc(x.code)})`:''}`:x.code?`<br>Code ${esc(x.code)} (kein Rabatt erfasst)`:''}<br>Versand ${eur(x.ship)}${tot?` (${eur(x.ship/tot)} pro Set)`:''}<br><b>Gesamt ${eur(x.total)}</b> für ${tot} Sets</div>
  <div style="text-align:right;margin-top:6px"><button class="sm ${cf==x.id?'low':''}" onclick="delP('${x.id}')">${cf==x.id?'Wirklich? Lager bleibt gleich':'Eintrag löschen'}</button></div>`:''}</div>`});
  return h}
function delP(id){if(cf!=id){cf=id;render();return}cf=null;D.purchases=D.purchases.filter(x=>x.id!=id);save();render()}
function ein_v(){
 const L=[...document.querySelectorAll('.eb')].map(el=>{const i=el.dataset.i,f=+$('eu'+i).value,c=Math.round(num($('ec'+i).value)),p=num($('ep'+i).value);return{i,sel:$('es'+i).value,f,c,p,sets:c*f,val:c*p}});
 const goods=L.reduce((a,x)=>a+x.val,0),sets=L.reduce((a,x)=>a+x.sets,0),ship=num($('ev').value),dv=num($('ed').value);

 r.push(['Summe Kundenaufträge','','','','',nf(k.reduce((a,o)=>a+o.price,0)),nf(k.reduce((a,o)=>a+o.cost,0)),nf(k.reduce((a,o)=>a+o.price-o.cost,0)),'','','','']);
 csvOut('besaitung-auftraege',r)}
function expB(){const P=D.purchases.filter(x=>inY(x.ts));
 const r=[['Datum','Shop','Saite','Menge','Einheit','Preis pro Einheit (€)','Sets','Rabattcode','Rabatt (€)','Versand (€)','Bestellsumme (€)']];
 P.forEach(x=>x.lines.forEach((l,i)=>r.push([dd(x.ts),x.shop,l.name,l.count,l.unit>1?'Rolle':'Set',nf(l.price),l.sets,i?'':x.code,i?'':nf(x.disc),i?'':nf(x.ship),i?'':nf(x.total)])));
 r.push(['Summe','','','','','','','','','',nf(P.reduce((a,x)=>a+x.total,0))]);
 csvOut('besaitung-bestellungen',r)}
function expT(){const T=D.tools.filter(t=>t.st=='bought'&&t.ts&&inY(t.ts));
 const r=[['Datum','Werkzeug / Ersatzteil','Notiz','Preis (€)']];T.forEach(t=>r.push([dd(t.ts),t.name,t.note||'',nf(t.cost)]));
 r.push(['Summe','','',nf(T.reduce((a,t)=>a+t.cost,0))]);csvOut('besaitung-werkzeug',r)}
function xcard(){return `<div class="card"><b>Tabellen für die Steuer (CSV)</b><div class="mu">Öffnen sich in Excel oder Numbers.</div>
 <label>Zeitraum</label><select onchange="ty=this.value"><option value="all">Alle Jahre</option>${years().map(y=>`<option value="${y}" ${ty==y?'selected':''}>${y}</option>`).join('')}</select>
 <div style="margin-top:10px"><button class="sm" style="margin:0" onclick="expA()">Aufträge</button><button class="sm" onclick="expB()">Bestellungen</button><button class="sm" onclick="expT()">Werkzeug</button></div></div>`}
function bkcard(){return `<div class="card"><b>Backup</b><div class="mu">${D.lastBackup?'Zuletzt: '+new Date(D.lastBackup).toLocaleString('de-DE'):'Noch keins gemacht'}<br>Import ersetzt alle aktuellen Daten.</div>
 <div style="margin-top:8px"><button class="sm" style="margin:0" onclick="exp()">Backup speichern</button><button class="sm" onclick="showT()">Als Text</button></div>
 <div style="margin-top:8px"><button class="sm" style="margin:0" onclick="$('f').click()">Datei importieren</button><button class="sm" onclick="bimp=!bimp;render()">Aus Text importieren</button><input type="file" id="f" class="hide" accept=".json,application/json" onchange="imp(this)"></div>
 ${bx!=null?`<textarea id="bt" readonly rows="5" style="${ta}">${esc(bx)}</textarea><div style="margin-top:6px"><button class="sm" style="margin:0" onclick="cpy()">Kopieren</button><button class="sm" onclick="bx=null;render()">Schließen</button></div>`:''}
 ${bimp?`<textarea id="bi" rows="5" placeholder="Backup-Text hier einfügen" style="${ta}"></textarea><button class="sm" style="margin:6px 0 0" onclick="impT()">Wiederherstellen</button>`:''}</div>`}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.strings&&d.orders){D=d;norm();save();render();toast('Import erfolgreich')}else toast('Ungültige Datei')}catch(e){toast('Ungültige Datei')}};r.readAsText(f)}
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
